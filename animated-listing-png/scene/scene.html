<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url(../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 500; src: url(../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2) format("woff2"); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; background: #fff; }

  /* ---------- BXGY widget (Figma 1322:24022) ---------- */
  #widget {
    left: 1151.65px; top: 284.28px; width: 366px; height: 241.83px;

  /* ---------- Stat cards (Figma 1448:3729 / 1448:3719) ---------- */
  .card {
    width: 198.356px; height: 84.832px; background: #fff; border: 1px solid #9a9a9a; border-radius: 11.228px;
    padding: 12.475px; font-family: "Plus Jakarta Sans", sans-serif; color: #2c2f30;
  }
  .card .glow { position: absolute; inset: -1px; border-radius: 11.228px; pointer-events: none; }
  .card .title { font-weight: 600; font-size: 14.97px; line-height: 19.96px; }
  .card .line { display: flex; align-items: center; gap: 13.723px; margin-top: 4.99px; height: 34.931px; }
  .card .val { font-weight: 700; font-size: 22.455px; line-height: 34.931px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pill {
    display: flex; align-items: center; gap: 6.052px; padding: 3.03px 9.089px; border-radius: 9999px; background: #ecfdf5;
    transform-origin: left center;
  }
  .pill .ico { position: relative; width: 8.837px; height: 5.302px; flex-shrink: 0; }
  .pill .ico img { position: absolute; left: 0; top: 0; width: 11.667px; height: 7px; display: block; }
  .pill .pct { font-weight: 700; font-size: 10.604px; line-height: 15.149px; color: #047857; white-space: nowrap; }
  #ppo .pill .pct { width: 41.613px; }
  #aov { left: 749.107px; top: 271.5px; }
  #ppo { left: 714.107px; top: 371.5px; }

  /* ---------- Nav bag (Figma 1322:23250) ---------- */
  #bag { left: 1532.28px; top: 108.99px; width: 22.472px; height: 22.472px; }
  #bag .v { position: absolute; left: 2.808px; top: 2.808px; width: 16.854px; height: 16.854px; display: block; }
  #bag .b {
    position: absolute; left: 12.443px; top: 11.634px; width: 13.036px; height: 13.036px; border-radius: 50%;
    background: #ea3538; color: #fff; font-family: "Inter", sans-serif; font-weight: 600; font-size: 8.957px;
    line-height: 13.036px; text-align: center;
  }

  /* ---------- Cursor ---------- */
  #cursor { left: 0; top: 0; width: 28px; height: 28px; pointer-events: none; transform-origin: 0 0; }
  #cursor svg { position: absolute; left: 0; top: 0; }
</style>

<body>
<div id="stage">
  <img id="plate" src="../source/frame-5@2x.png" alt="">

  <!-- covers that remove the static versions of everything we animate -->
  <div class="cover" style="left:1120px; top:262px; width:480px; height:294px;"></div>
  <div class="cover" style="left:1528px; top:104px; width:36px; height:36px;"></div>

  <!-- nav bag -->
  <div id="bag" class="abs">
    <img class="v" src="../source/assets/bag-icon.svg" alt="">
    <div class="b"><span id="bagN">1</span></div>
  </div>

  <!-- stat cards -->
  <div id="aov" class="card abs">
    <div class="glow"></div>
    <div class="title">Average order value</div>
    <div class="line">
      <div class="val" id="aovVal">$233</div>
      <div class="pill"><div class="ico"><img src="../source/assets/trend-up-aov.svg" alt=""></div><div class="pct" id="aovPct">4.5%</div></div>
    </div>
  </div>
  <div id="ppo" class="card abs">
    <div class="glow"></div>
    <div class="title">Product per order</div>
    <div class="line">
      <div class="val" id="ppoVal">+1.4</div>
      <div class="pill"><div class="ico"><img src="../source/assets/trend-up-ppo.svg" alt=""></div><div class="pct" id="ppoPct">0.6</div></div>
    </div>
  </div>

  <!-- BXGY widget -->
  <div id="widget" class="abs">
    <div class="banner">
      <div class="msg">
        <div class="content">
          <img src="../source/assets/discount-icon.svg" alt="">
          <p>You have unlocked special discount</p>
        </div>
        <div class="badge2">2</div>
      </div>
      <img class="chev" id="chev" src="../source/assets/collapse-chevron.svg" alt="">
    </div>
    <div class="row r1" id="row1">
      <div class="prod">
        <div class="thumb"><img src="../source/assets/insoles.png" alt=""></div>
        <div class="info">
          <div class="name">Kite Comfort Insoles</div>
          <div class="pricing"><span class="was">$32</span><span class="now">$16</span></div>
          <div class="size"><span>Size M</span><img src="../source/assets/size-dropdown-icon.svg" alt=""></div>
        </div>
      </div>
      <div class="add" id="add1">
        <div class="ripple" id="ripple"></div>
        <div class="lbl" id="add1a">Add</div>
        <div class="lbl" id="add1b"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6.3 4.8 9 10 3.4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Added</div>
      </div>
    </div>
    <div class="row r2" id="row2">
      <div class="prod">
        <div class="thumb"><img src="../source/assets/lace-kit.png" alt=""></div>
        <div class="info">
          <div class="name">Kite AirStride Lace Kit</div>
          <div class="pricing"><span class="was">$18</span><span class="now">$9</span></div>
        </div>
      </div>
      <div class="add"><div class="lbl">Add</div></div>
    </div>
  </div>

  <!-- pointer -->
  <div id="cursor" class="abs">
    <svg id="arrow" width="28" height="28" viewBox="0 0 28 28">
      <path d="M3 2 L3 21 L8 16.5 L11.5 24.5 L15 23 L11.6 15.2 L18.5 15.2 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    <svg id="hand" width="28" height="28" viewBox="0 0 28 28">
      <path d="M9.2 13.2V4.6a1.8 1.8 0 0 1 3.6 0v7.1-1.6a1.8 1.8 0 0 1 3.6 0v1.8-1a1.8 1.8 0 0 1 3.6 0v1.5-.6a1.7 1.7 0 0 1 3.4 0v6.3c0 4.1-2.9 7.1-7 7.1h-1.3c-2.3 0-3.9-.9-5.3-2.7l-4.1-5.5a1.8 1.8 0 0 1 2.8-2.2z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  </div>
</div>

<script>
// ---------- timeline helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const backOut = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const $ = id => document.getElementById(id);

// ---------- timeline (seconds) ----------
// The loop starts AND ends on the finished Figma state, so the first frame
// (what static viewers / thumbnails show) is the complete design and the
// loop seam is invisible.
const T = {
  duration: 7.0,
  resetA: 1.2, resetB: 1.65,     // widget collapses, everything rewinds
  openA: 2.05, openB: 2.75,      // widget expands
  moveA: 2.55, moveB: 3.55,      // pointer travels to "Add"
  press: 3.65, release: 3.8,     // click
  countA: 4.0, countB: 5.1,      // stat cards count up
  leaveA: 4.6, leaveB: 5.4,      // pointer leaves
};

const WIDGET_OPEN = 241.83, WIDGET_CLOSED = 44.607 + 1.128;
const ADD_CENTER = { x: 1437.3 + 33.4, y: 366.94 + 15.0 };
const CURSOR_START = { x: 1640, y: 760 };
const CURSOR_END = { x: 1640, y: 640 };

const fmtAov = v => "$" + Math.round(v);
const fmtPpo = v => "+" + v.toFixed(1);

function render(t) {
  // phase: 0 = finished state shown, 1 = rewound. Rewind happens resetA..resetB.
  const rewind = easeInOut(prog(t, T.resetA, T.resetB));
  const open = easeOut(prog(t, T.openA, T.openB));
  // widget openness: 1 (finished) -> 0 (rewound) -> 1 (re-opened)
  const openness = t < T.openA ? 1 - rewind : open;

  // widget height + rows
  $("widget").style.height = lerp(WIDGET_CLOSED, WIDGET_OPEN, openness) + "px";
  $("chev").style.transform = `scaleY(${lerp(1, -1, openness)})`;
  const r1 = t < T.openA ? openness : easeOut(prog(t, T.openA + 0.12, T.openB));
  const r2 = t < T.openA ? openness : easeOut(prog(t, T.openA + 0.24, T.openB + 0.1));
  $("row1").style.opacity = r1; $("row1").style.transform = `translateY(${lerp(-10, 0, r1)}px)`;
  $("row2").style.opacity = r2; $("row2").style.transform = `translateY(${lerp(-10, 0, r2)}px)`;

  // "Add" -> "Added" on the insoles row
  const added = t < T.resetB ? 1 : (t >= T.release ? 1 : 0);
  const swap = t < T.resetB ? 1 : easeOut(prog(t, T.release, T.release + 0.22));
  $("add1a").style.opacity = 1 - swap; $("add1a").style.transform = `translateY(${lerp(0, -12, swap)}px)`;
  $("add1b").style.opacity = swap;     $("add1b").style.transform = `translateY(${lerp(12, 0, swap)}px)`;
  let press = 0;
  if (t >= T.press && t < T.release) press = easeOut(prog(t, T.press, T.press + 0.08));
  else if (t >= T.release) press = 1 - easeOut(prog(t, T.release, T.release + 0.18));
  $("add1").style.transform = `scale(${1 - 0.07 * press})`;
  const rp = prog(t, T.press, T.press + 0.5);
  $("ripple").style.transform = `translate(-50%,-50%) scale(${rp > 0 && rp < 1 ? lerp(0, 9, easeOut(rp)) : 0})`;
  $("ripple").style.opacity = rp > 0 && rp < 1 ? 1 - rp : 0;

  // nav bag count 2 (finished) -> 1 (rewound) -> 2 after click, with a bump
  $("bagN").textContent = (t >= T.resetA + 0.2 && t < T.release + 0.05) ? "1" : "2";
  const bump = prog(t, T.release + 0.05, T.release + 0.45);
  const bs = bump > 0 && bump < 1 ? 1 + 0.45 * Math.sin(Math.PI * bump) : 1;
  document.querySelector("#bag .b").style.transform = `scale(${bs})`;

  // stat cards: finished values -> start values on rewind -> count up after the add
  const AOV0 = 186, AOV1 = 233, PPO0 = 1.0, PPO1 = 1.4;
  let c;
  if (t < T.countA) c = 1 - rewind; else c = easeInOut(prog(t, T.countA, T.countB));
  $("aovVal").textContent = fmtAov(lerp(AOV0, AOV1, c));
  $("ppoVal").textContent = fmtPpo(lerp(PPO0, PPO1, c));
  $("aovPct").textContent = c >= 0.999 ? "4.5%" : lerp(0, 4.5, c).toFixed(1) + "%";
  $("ppoPct").textContent = c >= 0.999 ? "0.6" : lerp(0, 0.6, c).toFixed(1);
  const pop = prog(t, T.countB - 0.15, T.countB + 0.3);
  const ps = pop > 0 && pop < 1 ? 1 + 0.12 * Math.sin(Math.PI * pop) : 1;
  document.querySelectorAll(".pill").forEach(p => p.style.transform = `scale(${ps})`);
  const glow = t >= T.countA ? Math.sin(Math.PI * prog(t, T.countA, T.countB + 0.4)) : 0;
  document.querySelectorAll(".card .glow").forEach(g =>
    g.style.boxShadow = `0 0 0 ${2.5 * glow}px rgba(16,185,129,${0.35 * glow})`);

  // pointer
  let x, y, vis = 1, hand = false;
  if (t < T.moveA || t > T.leaveB) vis = 0;
  if (t <= T.press) {
    const m = easeInOut(prog(t, T.moveA, T.moveB));
    // slight arc
    x = lerp(CURSOR_START.x, ADD_CENTER.x, m);
    y = lerp(CURSOR_START.y, ADD_CENTER.y, m) + Math.sin(Math.PI * m) * 30;
    hand = m > 0.9;
  } else {
    const m = easeInOut(prog(t, T.leaveA, T.leaveB));
    x = lerp(ADD_CENTER.x, CURSOR_END.x, m);
    y = lerp(ADD_CENTER.y, CURSOR_END.y, m);
    hand = m < 0.1;
  }
  const cs = 1 - 0.12 * press;
  const hx = hand ? 13 : 3, hy = hand ? 3 : 2; // hotspot offsets
  $("cursor").style.opacity = vis;
  $("cursor").style.transform = `translate(${x - hx}px, ${y - hy}px) scale(${cs})`;
  $("arrow").style.display = hand ? "none" : "block";
  $("hand").style.display = hand ? "block" : "none";
}

window.render = render;
window.TIMELINE = T;
render(0);
</script>
</body>
